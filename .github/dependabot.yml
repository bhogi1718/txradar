version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
      production:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the new native (Go) compiler and ESLint 10 needs
      # eslint-config-next support; upgrade these deliberately, not weekly.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Types must match the Node major we run on (see .nvmrc / engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
